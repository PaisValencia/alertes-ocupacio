name: Actualitza les API d'ocupació

on:
  schedule:
    # Cada dia a les 5:00 UTC (6:00 a l'hivern i 7:00 a l'estiu, hora peninsular),
    # abans de l'alerta de les 7:33.
    - cron: "0 5 * * *"
  workflow_dispatch: {}   # botó «Run workflow» per a executar-ho a mà

permissions:
  contents: write

concurrency:
  group: actualitza
  cancel-in-progress: false

jobs:
  actualitza:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixa el repositori
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·la les dependències
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Proves dels filtres
        run: python -m proves.prova_filtres

      - name: Executa totes les fonts
        run: python principal.py

      - name: Guarda els resultats al repositori (i GitHub Pages els publica)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs dades
          git diff --cached --quiet || git commit -m "Actualització $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
